spring.application.name=onlineshoppingwebsite
#========Database Configuration========
spring.datasource.url=jdbc:mysql://localhost:1433;databaseName=onlineshoppingdb,encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
#=======Hibernate===============
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# =================== FILE UPLOAD ===================                           
file.upload-dir=src/main/resources/static/images/
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# =================== ENCODING ===================
spring.web.servlet.encoding.charset=UTF-8
spring.web.servlet.encoding.enabled=true
spring.web.servlet.encoding.force=true 

# =================== THYMELEAF ===================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

